bio:
  - I am a Mathematics-Computer Science undergraduate at UC San Diego (expected March 2027), working on embodied intelligence with Prof. Xiaolong Wang.
  - My research focuses on active perception, world models, and coupling perception with whole-body control for humanoid manipulation and navigation.
  - I am a co-first author of HuG (CoRL 2026) and am currently developing ROAM, a memory-driven system for open-vocabulary object retrieval.
