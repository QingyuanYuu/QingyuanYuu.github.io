- title: Research Experience
  type: time_table
  contents:
    - title: '<a href="/projects/5_roam/">ROAM: Memory-Driven Active Observation for Open-Vocabulary Object Retrieval</a>'
      institution: "Co-First Author · Advisor: Prof. Xiaolong Wang, UC San Diego"
      year: 2026-06 – Present
      description:
        - Designed the perception, memory, exploration, and navigation subsystems; proposed a memory-completeness-driven revisit
          scheduler that plans multi-degree-of-freedom viewpoints and improved object recall from 28.8% to 46.7%.
        - Built YOLO-World, SAM2, and 3D association pipelines, and introduced anchor-keyframe-relative pose storage to eliminate
          accumulated SLAM drift, keeping median object-localization error within 12 cm.
        - Evaluated the system on GOAT-Bench, improving memory-retrieval success from 0.166 to 0.238 and reducing navigation path
          length to known targets from 55.1 m to 5.8 m, with a 7.2× improvement in SPL.
        - Deployed the system on a Dexmate Vega wheeled humanoid robot and designed an adaptive recovery strategy that reduced
          exploration runs invalidated by getting stuck from approximately 33% to 0%.
    - title: '<a href="https://xuanbinpeng.com/hug/">HuG: Humanoid Whole-Body Affordance-Aware Grasping with Active Perception</a>'
      institution: "Co-First Author · Advisor: Prof. Xiaolong Wang, UC San Diego · CoRL 2026"
      year: 2025-11 – 2026-04
      description:
        - Proposed the Perceive-Align-Grasp (PAG) embodied-intelligence framework and designed a Bayesian-belief active perception
          algorithm in the Perceive stage; maintained a probability distribution over a yaw–height viewpoint grid and improved
          target detection success under severe occlusion from 57.5% to 92.5%.
        - Bridged perception and downstream whole-body control by aligning active-perception viewpoints online with the input
          distribution of a CVAE-based grasping policy, and used multidimensional point-cloud quality metrics to determine when
          to stop observing; stabilized post-detection grasping success at 87.0%.
        - Integrated Python, PyTorch, ROS2, OpenCV, and point-cloud processing modules; deployed and validated the complete system
          on a Unitree G1 humanoid robot equipped with a 3-DoF active head and dexterous hands, improving end-to-end success on
          multi-shelf tasks from 50% to 87.5%.
        - Trained exclusively on simulation data without real demonstrations and achieved zero-shot sim-to-real transfer, reaching
          90% (seen) and 85% (novel) whole-body grasping success rates on the real robot.
