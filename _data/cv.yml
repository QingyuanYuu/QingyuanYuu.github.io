- title: Project Experience
  type: time_table
  contents:
    - title: <a href="/projects/6_qwen_reasoning/">Fine-Tuning Qwen3-4B for Reasoning</a>
      institution: CSE 151B Deep Learning
      year: 2026-03 – 2026-06
      description:
        - Built a three-stage Prompt Engineering, LoRA SFT, and GRPO fine-tuning pipeline, leading the implementation, and improved
          validation accuracy from 47% to 66.22% under an approximately $50 H100 compute budget.
        - Addressed training instability caused by inconsistent prompt formats between the SFT and RL stages by designing a prompt-alignment
          mechanism and hard-prompt boost; quantitatively attributed gains to Prompt Engineering (+12%), SFT (+6%), and GRPO (+1.78%).
    - title: <a href="/projects/7_vlm_reward_hacking/">Can Vision-Language Models Audit Reward Hacking?</a>
      institution: CSE 190 Deep Reinforcement Learning
      year: 2026-03 – 2026-06
      description:
        - Designed five reward variants across MuJoCo continuous-control tasks, trained 20 PPO policies, constructed a benchmark,
          and proposed the hackΔ metric to quantify the severity of reward exploitation.
        - Analyzed anomalous negative hackΔ values in Hopper and Humanoid, formally distinguishing policy exploitation of reward
          loopholes from policy non-learning as two failure modes and strengthening the rigor of the VLM audit benchmark.
        - Strengthened the statistical rigor of RL experiments by analyzing the marginal effects of single random seeds, compute
          constraints, and high training variance reaching up to a 92% coefficient of variation.
    - title: <a href="/projects/8_robot_state_estimation/">Robot State Estimation and SLAM</a>
      institution: ECE 276A Sensing and Estimation in Robotics (graduate course)
      year: 2026-01 – 2026-03
      description:
        - Derived the linearized point-to-line ICP residual and vectorized k-NN PCA normal estimation with batched eigendecomposition,
          roughly two orders of magnitude faster than the loop implementation; with GTSAM pose-graph optimization over approximately
          1,000 keyframes, reduced start-to-end trajectory error from approximately 2 m to under 0.1 m on both corridor datasets.
        - Implemented an EKF on SE(3) with uncertainty parameterized in se(3), deriving landmark and pose Jacobians, and wrote
          a stereo front-end from scratch (Shi-Tomasi corners, pyramidal Lucas–Kanade tracking, forward-backward and epipolar
          consistency checks) yielding 6,733 feature tracks over 6,393 frames.
    - title: <a href="/projects/3_ocr_robocar/">Autonomous Driving Car with Vision-Based Traffic Sign Recognition</a>
      institution: ECE 148 Introduction to Autonomous Vehicles
      year: 2025-09 – 2025-12
      description:
        - Trained an end-to-end CNN behavioral-cloning policy on human-driving demonstrations collected on the vehicle, mapping
          camera frames directly to steering commands, for trajectory reconstruction.
        - "Built and tuned the team’s ROS2 perception-and-control stack on a VESC-driven 1/10-scale vehicle: HSV lane detection,
          PID steering control, and a four-state machine for blue-tape intersection handling."
        - Designed and integrated an OCR traffic-sign recognition module that passed real-time textual decision information to
          the vehicle-control node, achieving 95% recognition accuracy and 10 Hz closed-loop inference in real-world tests.
